spring.config.import=optional:file:env.properties
# =====================================================================
# 2.
# =====================================================================
spring.application.name=vk-currency-bot
spring.messages.encoding=UTF-8
# =====================================================================
# 3. VK API (???????? ??????? ?? env.properties)
# =====================================================================
vk.groupId=${VK_GROUP_ID}
vk.accessToken=${VK_ACCESS_TOKEN}
vk.apiVersion=5.199
vk.longpollWait=25
vk.apiUrl=${VK_API_URL:https://api.vk.com/method}

# =====================================================================
# 4. CBR API (?? ??)
# =====================================================================
cbr.url=https://cbr.ru/scripts/XML_daily.asp?date_req=%s

# =====================================================================
# 5. ???? ?????? (???????? ??????? ?? env.properties)
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ????????? ???? ?????????? HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# =====================================================================
# 6. JPA / HIBERNATE
# =====================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =====================================================================
# 7. FLYWAY (????????)
# =====================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =====================================================================
# 8. SERVER (TOMCAT)
# =====================================================================
#server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s


# =====================================================================
# 9. ACTUATOR
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# =====================================================================
